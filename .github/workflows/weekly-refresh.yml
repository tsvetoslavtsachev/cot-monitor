name: Weekly COT Refresh

on:
  schedule:
    - cron: '0 21 * * 5'   # Friday 21:00 UTC = 5:00 PM ET, after CFTC 3:30 PM ET release
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.commit.outputs.data_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch COT data
        run: python scripts/fetch_cot.py

      - name: Build derived metrics
        run: python scripts/derive_metrics.py

      - name: Build CTA replication model
        run: python scripts/cta_model.py

      - name: Generate AI context file
        run: python scripts/generate_ai_context.py

      - name: Commit refreshed data if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "data_changed=false" >> $GITHUB_OUTPUT
            echo "No data changes to commit."
          else
            git commit -m "data: weekly COT refresh $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
            echo "data_changed=true" >> $GITHUB_OUTPUT
          fi

  deploy-pages:
    needs: refresh-data
    runs-on: ubuntu-latest
    if: ${{ needs.refresh-data.outputs.data_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main   # Always deploy from latest main after data commit

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # Serve entire repo root (index.html + data/)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
