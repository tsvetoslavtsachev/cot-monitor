name: Weekly COT Refresh

on:
  schedule:
    # Sat 06:23 UTC — deliberately AFTER collectors/cot.yml (Sat 04:23 UTC since
    # the Р2 swap 06.08.2026; observed push ~05:15 UTC) writes the weekly data-core
    # base: ~1h buffer, and odd minutes to dodge the round-hour scheduler queue
    # (the old 08:00 slot queued 1.5-3h -> map landed ~12:30 Sofia; now ~10:00).
    # The old Fri 21:00 slot ran BEFORE the Saturday write, so the dashboard read
    # the base one cycle behind by construction and froze silently when a holiday
    # slipped a reporting cycle (the Jul-4 2026 bug). The check_freshness gate
    # fails RED (loud) if this ever races ahead of the cot collect on a slow day.
    - cron: '23 6 * * 6'
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    env:
      # S13c (INIT-22): set this repo secret to source COT cohorts from data-core
      # (the guarded base). ABSENT -> the base/collectors checkouts are skipped and
      # scripts/fetch_cot.py falls back to its CFTC fetch (production unchanged —
      # strangler: the dashboard never stops). data-core is private (needs the PAT);
      # collectors is public.
      DATACORE_PAT: ${{ secrets.DATACORE_PAT }}
    outputs:
      data_changed: ${{ steps.commit.outputs.data_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- S13c: COT cohorts come FROM data-core; only present when PAT is set ----
      - name: Checkout data-core (private base)
        if: ${{ env.DATACORE_PAT != '' }}
        uses: actions/checkout@v4
        with:
          repository: tsvetoslavtsachev/data-core
          token: ${{ env.DATACORE_PAT }}
          path: .data-core
      - name: Checkout collectors (consumer lib)
        if: ${{ env.DATACORE_PAT != '' }}
        uses: actions/checkout@v4
        with:
          repository: tsvetoslavtsachev/collectors
          path: .collectors

      - name: Fetch COT data
        env:
          # When the checkouts ran, fetch_cot sources the cohort rows from the base;
          # otherwise these point at absent dirs and it transparently uses CFTC.
          DATACORE_ROOT: ${{ github.workspace }}/.data-core
          PYTHONPATH: ${{ github.workspace }}/.collectors
        run: python scripts/fetch_cot.py

      # A1 guard: with the PAT set, base sourcing is INTENDED — fail RED (before any
      # commit/deploy) if a market silently fell back to CFTC, so the spliced
      # percentiles can never quietly return on a green run.
      - name: Assert base-sourced (no silent CFTC fallback)
        if: ${{ env.DATACORE_PAT != '' }}
        run: python scripts/assert_base_sourced.py

      # Freshness guard: the COT report dates come from the data-core base (written
      # Sat 07:30 UTC). Prices (Yahoo) and manifest.generated_at move on EVERY run,
      # so a commit ALWAYS lands and a frozen COT frontier can ship green. Fail RED
      # here — before any build/commit/deploy — when the newest report date across
      # data/markets/*.json is stale (a missed weekly reporting cycle).
      - name: Assert data freshness (COT frontier advanced)
        run: python scripts/check_freshness.py

      - name: Build derived metrics
        run: python scripts/derive_metrics.py

      - name: Build CTA replication model
        run: python scripts/cta_model.py

      - name: Generate AI context file
        run: python scripts/generate_ai_context.py

      - name: Commit refreshed data if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "data_changed=false" >> $GITHUB_OUTPUT
            echo "No data changes to commit."
          else
            git commit -m "data: weekly COT refresh $(date -u +'%Y-%m-%d')"
            # -X theirs: the refresh regenerates data/ wholesale, so a rebase against a
            # concurrent push always conflicts; ours-is-newest wins (P9 dashboards pattern,
            # мандат №32/cot push-race).
            git pull --rebase -X theirs origin main
            git push
            echo "data_changed=true" >> $GITHUB_OUTPUT
          fi

  deploy-pages:
    needs: refresh-data
    runs-on: ubuntu-latest
    if: ${{ needs.refresh-data.outputs.data_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main   # Always deploy from latest main after data commit

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Defensive cleanup: delete any prior github-pages artifacts in this run.
      # GitHub occasionally leaves stale artifacts when runs queue up via the
      # "pages" concurrency group, causing deploy-pages to fail with
      # "Multiple artifacts named 'github-pages' were unexpectedly found".
      - name: Cleanup prior github-pages artifacts
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const res = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              for (const a of res.data.artifacts) {
                if (a.name === 'github-pages') {
                  console.log(`Deleting prior artifact ${a.id} (${a.name})`);
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: a.id,
                  });
                }
              }
            } catch (e) {
              console.log('Cleanup step non-fatal error: ' + e.message);
            }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # Serve entire repo root (index.html + data/)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
